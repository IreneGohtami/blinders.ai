name: Train Model With Scraped Data

on:
  schedule:
    - cron: "30 */4 * * *" # every 4 hours
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create cookies file
        run: |
          if [ -n "${{ secrets.YTDL_COOKIES }}" ]; then
            echo "${{ secrets.YTDL_COOKIES }}" > cookies.txt
            echo "✅ Cookies file created ($(wc -c < cookies.txt) bytes)"
          else
            echo "# Empty cookies file" > cookies.txt
            echo "⚠️ No cookies provided, yt-dlp may fail on some videos"
          fi

      - name: Run training script
        env:
          YTDL_COOKIES_FILE: cookies.txt
        run: python scripts/training/train_model.py